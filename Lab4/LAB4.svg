<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="4in" height="4in"
     viewBox="0 0 400 400"
     preserveAspectRatio="xMidYMid meet">

  <!-- Tło sceny -->
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff" stroke="black" stroke-width="2"/>

  <defs>
    <!--
      Wariant: foremny 14-kąt (tetradecagon) wpisany w okrąg
      o środku (200, 200) i promieniu 200.
      Wierzchołek i = 0 leży na górze: kąt -90° + i * (360°/14).
      Szprychy łączą środek z każdym wierzchołkiem.
      Cała grupa obraca się w nieskończoność (SMIL animateTransform).
    -->
    <g id="polygon" stroke="black" fill="none">
      <polygon
        points="200.000,0.000 286.777,19.806 356.366,75.302 394.986,155.496
                394.986,244.504 356.366,324.698 286.777,380.194 200.000,400.000
                113.223,380.194 43.634,324.698 5.014,244.504 5.014,155.496
                43.634,75.302 113.223,19.806"
        fill="none" stroke="black" stroke-width="2"/>
      <line x1="200.000" y1="0.000"   x2="200" y2="200"/>
      <line x1="286.777" y1="19.806"  x2="200" y2="200"/>
      <line x1="356.366" y1="75.302"  x2="200" y2="200"/>
      <line x1="394.986" y1="155.496" x2="200" y2="200"/>
      <line x1="394.986" y1="244.504" x2="200" y2="200"/>
      <line x1="356.366" y1="324.698" x2="200" y2="200"/>
      <line x1="286.777" y1="380.194" x2="200" y2="200"/>
      <line x1="200.000" y1="400.000" x2="200" y2="200"/>
      <line x1="113.223" y1="380.194" x2="200" y2="200"/>
      <line x1="43.634"  y1="324.698" x2="200" y2="200"/>
      <line x1="5.014"   y1="244.504" x2="200" y2="200"/>
      <line x1="5.014"   y1="155.496" x2="200" y2="200"/>
      <line x1="43.634"  y1="75.302"  x2="200" y2="200"/>
      <line x1="113.223" y1="19.806"  x2="200" y2="200"/>
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 200 200"
        to="360 200 200"
        dur="5s"
        repeatCount="indefinite"/>
    </g>

    <!-- Belka / żerdź namiotu -->
    <g id="beam">
      <line x1="140" y1="100" x2="260" y2="100"
            transform="rotate(15 200 100)"
            stroke="red" stroke-width="8"/>
    </g>

    <!-- Trójkątny dach namiotu (kolor nadawany przy <use>) -->
    <g id="triangle">
      <polygon points="200,100 215,190 185,190" stroke="black" stroke-width="3"/>
    </g>
  </defs>

  <!-- Hierarchia: trzy namioty o różnych skalach; każdy składa się
       z dwóch obracających się 14-kątów, belki i trójkąta. -->

  <!-- Namiot fioletowy (skala 0,8) -->
  <g id="namiot-fioletowy">
    <use xlink:href="#polygon" transform="scale(0.12) translate(430,370)"/>
    <use xlink:href="#polygon" transform="scale(0.12) translate(1170,570)"/>
    <use xlink:href="#beam" transform="scale(0.8) translate(-50,0)"/>
    <use xlink:href="#triangle" fill="purple" transform="scale(0.8) translate(-50,0)"/>
  </g>

  <!-- Namiot niebieski (skala 1,0) -->
  <g id="namiot-niebieski">
    <use xlink:href="#polygon" transform="scale(0.14) translate(820,1120)"/>
    <use xlink:href="#polygon" transform="scale(0.14) translate(1630,1340)"/>
    <use xlink:href="#beam" transform="scale(1) translate(0,100)"/>
    <use xlink:href="#triangle" fill="blue" transform="scale(1) translate(0,100)"/>
  </g>

  <!-- Namiot zielony (skala 0,6) -->
  <g id="namiot-zielony">
    <use xlink:href="#polygon" transform="scale(0.1) translate(2160,360)"/>
    <use xlink:href="#polygon" transform="scale(0.1) translate(2840,550)"/>
    <use xlink:href="#beam" transform="scale(0.6) translate(250,10)"/>
    <use xlink:href="#triangle" fill="green" transform="scale(0.6) translate(250,10)"/>
  </g>
</svg>
