<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hetman — Three.js</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: system-ui, sans-serif;
      color: #eee;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hint {
      position: fixed; left: 16px; bottom: 16px; z-index: 2;
      font: 13px/1.4 system-ui, sans-serif; color: #888;
      pointer-events: none; user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hint">Przeciągnij, aby obrócić · scroll przybliża</div>
  <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 1.2);
key.position.set(10, 20, 15);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.5);
fill.position.set(-10, 5, -10);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(10, 0.6, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.update();

const white = new THREE.MeshStandardMaterial({
  color: 0xf2f2ee, metalness: 0.05, roughness: 0.35
});

// Prosty profil tokarki: podstawa, trzon, 3 kręgi (szeroki → węższy → najwęższy), czubek.
const points = [
  [3.4, 0.00],
  [3.4, 0.28],
  [2.8, 0.48],
  [2.0, 0.70],
  [1.15, 1.50],
  [0.95, 2.80],
  [0.95, 5.80],

  [0.95, 6.00],
  [1.95, 6.18],
  [1.95, 6.48],
  [1.00, 6.68],

  [0.95, 6.82],
  [1.55, 7.00],
  [1.55, 7.24],
  [0.95, 7.42],

  [0.90, 7.56],
  [1.20, 7.72],
  [1.20, 7.92],
  [0.90, 8.06],

  [0.95, 8.28],
  [1.70, 8.62],
  [1.90, 8.92],
  [1.90, 9.12],
  [1.50, 9.32],
].map(([x, y]) => new THREE.Vector2(x, y));

const group = new THREE.Group();

const body = new THREE.Mesh(new THREE.LatheGeometry(points, 64), white);
group.add(body);

const crownY = 9.32;
const crownR = 1.35;
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const spike = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.55, 12), white);
  spike.position.set(Math.cos(a) * crownR, crownY + 0.25, Math.sin(a) * crownR);
  group.add(spike);
}

const ball = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), white);
ball.position.y = crownY + 0.55;
group.add(ball);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 48),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.001;
group.add(shadow);

group.position.y = -4.9;
scene.add(group);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
  </script>
</body>
</html>
